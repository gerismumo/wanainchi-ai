services:
  postgres:
    image: postgres:16-alpine
    container_name: wananchiai_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wananchiai_dev
    volumes:
      - wananchiai_postgres_dev:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wananchiai_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - wananchiai_minio_dev:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI → http://localhost:9001

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wananchiai_api_dev
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: wananchiai_web_dev
    restart: unless-stopped
    env_file:
      - ./apps/web/.env
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  wananchiai_postgres_dev:
  wananchiai_minio_dev:
