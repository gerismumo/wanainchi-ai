services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wananchiai_api
    expose:
      - '3000'
    restart: always
    env_file:
      - /home/apps/wananchiai/api/.env
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: wananchiai_web
    restart: always
    env_file:
      - /home/apps/wananchiai/web/.env
    expose:
      - '3001'
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: wananchiai_db
    env_file:
      - /home/apps/wananchiai/.env
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - wananchiai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00_init-databases.sql:ro
    ports:
     - "5437:5432"
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: wananchiai_minio
    env_file:
      - /home/apps/wananchiai/.env
    command: server /data --console-address ":9001"
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - wananchiai_minio_data:/data
    ports:
      - "9040:9000"
      - "9041:9001"
    networks:
      - app-network

volumes:
  wananchiai_postgres_data:
  wananchiai_minio_data:

networks:
  app-network:
    external: true
